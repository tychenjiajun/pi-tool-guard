<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="with the guard — command runs once, full log kept">
  <defs>
    <linearGradient id="frameAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#0d0d12"/>

  <rect x="48" y="40" rx="8" width="360" height="52" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="228" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#c4b5fd">with pi-tool-guard</text>

  <rect x="48" y="128" rx="16" width="1184" height="624" fill="#101017" stroke="#26262f" stroke-width="2"/>
  <rect x="48" y="128" rx="16" width="1184" height="64" fill="#16161d"/>
  <circle cx="92" cy="160" r="10" fill="#ff5f57"/>
  <circle cx="124" cy="160" r="10" fill="#febc2e"/>
  <circle cx="156" cy="160" r="10" fill="#28c840"/>
  <text x="640" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#8b8b9e">pi session — the guard strips the view extractor</text>

  <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="27" fill="#e6e6ef">
    <tspan x="96" dy="0"><tspan fill="#8f89a8">user &gt;</tspan> run the tests</tspan>
    <tspan x="96" dy="1.4em"><tspan fill="#8f89a8">guard &gt;</tspan> runs <tspan fill="#82aaff">npx vitest run</tspan> once — no pipeline</tspan>
    <tspan x="96" dy="1.4em" fill="#f2cc60">… 1,462 lines of output, Took 3m 12s</tspan>
    <tspan x="96" dy="1.4em"><tspan fill="#8f89a8">guard &gt;</tspan> full log kept in <tspan fill="#7ee787">pi-bash-guard-&lt;hex&gt;.log</tspan></tspan>
    <tspan x="96" dy="1.4em" fill="#7ee787">🛡 pi-tool-guard · grep '✓|×|FAIL' | tail -40</tspan>
    <tspan x="96" dy="1.4em" xml:space="preserve" fill="#7ee787">   Context saved · 1,462 → 40 lines · 97% smaller</tspan>
  </text>
</svg>
