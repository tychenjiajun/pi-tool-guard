<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="before — the model re-runs a slow suite">
  <defs>
    <linearGradient id="frameAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#0d0d12"/>

  <rect x="48" y="40" rx="8" width="460" height="52" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444"/>
    <text x="278" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#fca5a5">before · without the guard</text>

  <rect x="48" y="128" rx="16" width="1184" height="624" fill="#101017" stroke="#26262f" stroke-width="2"/>
  <rect x="48" y="128" rx="16" width="1184" height="64" fill="#16161d"/>
  <circle cx="92" cy="160" r="10" fill="#ff5f57"/>
  <circle cx="124" cy="160" r="10" fill="#febc2e"/>
  <circle cx="156" cy="160" r="10" fill="#28c840"/>
  <text x="640" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#8b8b9e">pi session — vitest suite takes minutes</text>

  <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="27" fill="#e6e6ef">
    <tspan x="96" dy="0"><tspan fill="#8f89a8">user &gt;</tspan> run the tests</tspan>
    <tspan x="96" dy="1.4em"><tspan fill="#8f89a8">bash &gt;</tspan> npx vitest run 2&gt;&amp;1 | grep -E <tspan fill="#7ee787">'✓|×|FAIL'</tspan> | tail -40</tspan>
    <tspan x="96" dy="1.4em" fill="#f2cc60">… 1,462 lines of output, Took 3m 12s</tspan>
    <tspan x="96" dy="1.4em"><tspan fill="#8f89a8">user &gt;</tspan> which of the failures are in pipeline.ts?</tspan>
    <tspan x="96" dy="1.4em" fill="#f87171">bash &gt; npx vitest run 2&gt;&amp;1 | grep pipeline … Took 3m 09s</tspan>
    <tspan x="96" dy="1.4em" fill="#f87171">↺ same minutes-long suite re-run, just to see another slice</tspan>
  </text>
</svg>
