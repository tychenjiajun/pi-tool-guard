<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="pi-tool-guard — run expensive bash once, repair tool-call arguments">
  <title>pi-tool-guard — runs an expensive bash command once and keeps its full log, and repairs the argument names the model got wrong</title>
  <desc>Pi extension: a slow bash command runs once with its full log kept so the model reads any slice instead of re-running, and wrong argument aliases for edit/write/read are rewritten before schema validation.</desc>

  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="#0d0d12"/>
  <ellipse cx="1340" cy="60" rx="520" ry="360" fill="url(#glowA)"/>
  <ellipse cx="200" cy="960" rx="480" ry="340" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- shield glyph (single icon-like element, reads at 168px) -->
  <g transform="translate(800 210)">
    <path d="M0,-110 L92,-72 L92,10 C92,72 48,108 0,124 C-48,108 -92,72 -92,10 L-92,-72 Z"
          fill="url(#shieldFill)" stroke="#c4b5fd" stroke-width="6"/>
    <path d="M-40,4 L-10,36 L46,-30" fill="none" stroke="#ffffff" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- name: dominant element -->
  <text x="800" y="452" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="132" font-weight="800" fill="#f6f4ff" letter-spacing="-2">pi-tool-guard</text>

  <!-- tagline -->
  <text x="800" y="530" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="31" fill="#9a94b3">run an expensive bash command <tspan fill="#a78bfa" font-weight="700">once</tspan> · repair tool-call <tspan fill="#a78bfa" font-weight="700">arguments</tspan></text>

  <!-- two value chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="27">
    <rect x="250" y="596" width="540" height="104" rx="18" fill="#16131f" stroke="#3b3566" stroke-width="2"/>
    <text x="520" y="640" text-anchor="middle" fill="#7ee787" font-weight="700">1× slow command</text>
    <text x="520" y="678" text-anchor="middle" fill="#8f89a8">log kept · read any slice</text>

    <rect x="810" y="596" width="540" height="104" rx="18" fill="#16131f" stroke="#3b3566" stroke-width="2"/>
    <text x="1080" y="640" text-anchor="middle" fill="#7ee787" font-weight="700">wrong arg names?</text>
    <text x="1080" y="678" text-anchor="middle" fill="#8f89a8">rewritten · no error · no retry</text>
  </g>

  <!-- install pill -->
  <rect x="360" y="770" rx="20" width="880" height="96" fill="#16161d" stroke="url(#accent)" stroke-width="4"/>
  <text x="800" y="832" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="40" fill="#a78bfa">$ pi install npm:pi-tool-guard</text>

  <!-- corner label -->
  <rect x="1300" y="60" rx="10" width="200" height="48" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-opacity="0.8"/>
  <text x="1400" y="93" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="24" fill="#c4b5fd">pi extension</text>
</svg>
